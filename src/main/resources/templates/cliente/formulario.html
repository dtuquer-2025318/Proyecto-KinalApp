<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Cliente</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="main-container">
    <h2 th:text="${cliente.DPICliente == null ? 'Registrar Nuevo Cliente' : 'Actualizar Cliente'}"></h2>

    <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post" class="form-layout"
          onsubmit="return confirm('¿Confirmas que los datos ingresados son correctos para guardar este registro?')">

        <div class="form-group full-width">
            <label>DPI (Identificación):</label>
            <input type="text" th:field="*{DPICliente}"
                   th:readonly="${cliente.DPICliente != null}"
                   placeholder="Ingrese DPI sin guiones" required>
        </div>

        <div class="form-group">
            <label>Nombres:</label>
            <input type="text" th:field="*{nombreCliente}" placeholder="Nombres del cliente" required>
        </div>

        <div class="form-group">
            <label>Apellidos:</label>
            <input type="text" th:field="*{apellidoCliente}" placeholder="Apellidos del cliente" required>
        </div>

        <div class="form-group full-width">
            <label>Dirección de Domicilio:</label>
            <input type="text" th:field="*{direccion}" placeholder="Ej: Zona 1, Ciudad de Guatemala" required>
        </div>

        <div class="form-group full-width">
            <label>Estado de Cuenta:</label>
            <select th:field="*{estado}">
                <option value="1">Cliente Activo</option>
                <option value="0">Cliente Inactivo</option>
            </select>
        </div>

        <div class="actions-container full-width">
            <button type="submit" class="btn-main btn-fire">GUARDAR CLIENTE</button>
            <button type="button" class="btn-main"
                    onclick="if(confirm('¿Estás seguro de que deseas salir? Los cambios no guardados se perderán.')) { history.back(); }">
                CANCELAR
            </button>
        </div>
    </form>
</div>
</body>
</html>
