<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Registro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="auth-container" style="max-width: 600px;">
    <h2>Crear Cuenta</h2>

    <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post" class="form-layout">
        <div class="form-group full-width">
            <label>Nombre de Usuario</label>
            <input type="text" th:field="*{username}" required>
        </div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" th:field="*{password}" required>
        </div>

        <div class="form-group">
            <label>Tipo de Cuenta</label>
            <select th:field="*{rol}" required>
                <option value="ADMIN">Administrador</option>
                <option value="USUARIO">Usuario Estándar</option>
            </select>
        </div>

        <div class="form-group">
            <label>Estado Inicial</label>
            <select th:field="*{estado}" required>
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>

        <div class="full-width" style="display: flex; gap: 10px; margin-top: 20px;">

            <button type="submit" class="btn-main btn-fire" style="flex: 1;">REGISTRARSE</button>
            <a th:href="@{/login}" class="btn-main" style="flex: 1; background: #64748b; text-align: center;">CANCELAR</a>
        </div>
    </form>

    <p class="login-footer">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
</div>
</body>
</html>
