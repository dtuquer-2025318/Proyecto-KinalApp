<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Registro / Gestión</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="auth-container" style="max-width: 600px;">
    <h2 th:text="${usuario.codigoUsuario == null ? 'Crear Cuenta' : 'Editar Usuario'}">Crear Cuenta</h2>

    <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post" class="form-layout">

        <input type="hidden" th:field="*{codigoUsuario}">

        <div class="form-group full-width">
            <label>Nombre de Usuario</label>
            <input type="text" th:field="*{username}" required>
        </div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" th:field="*{password}" th:required="${usuario.codigoUsuario == null}">
        </div>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="form-group">
            <label>Tipo de Cuenta</label>
            <select th:field="*{rol}" required>
                <option value="ADMIN">Administrador</option>
                <option value="USUARIO">Usuario Estándar</option>
            </select>
        </div>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="form-group">
            <label>Estado Inicial</label>
            <select th:field="*{estado}" required>
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>

        <div th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">
            <input type="hidden" name="rol" value="USUARIO">
            <input type="hidden" name="estado" value="1">
        </div>

        <div class="full-width" style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn-main btn-fire" style="flex: 1;">GUARDAR / REGISTRARSE</button>
            <a th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/usuario/lista} : @{/login}"
               class="btn-main" style="flex: 1; background: #64748b; text-align: center;">CANCELAR</a>
        </div>
    </form>

    <p class="login-footer" th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
</div>
</body>
</html>
