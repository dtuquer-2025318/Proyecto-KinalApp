<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Login</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="auth-container">
    <h2>KinalApp</h2>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="Tu usuario" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-main">ENTRAR</button>
    </form>
    <div>
        <p class="link-footer">¿Crear una Cuenta? <a th:href="@{/usuario/nuevo}">Regístrate aquí</a></p>
    </div>
</div>
</body>
</html>
