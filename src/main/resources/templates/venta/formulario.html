<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Nueva Venta</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="main-container">
    <h2>Registrar Transacción</h2>

    <form th:action="@{/venta/guardar}" th:object="${venta}" method="post" class="form-layout"
          onsubmit="return confirm('¿Deseas registrar esta venta?')">

        <div class="form-group full-width">
            <label>Fecha de Venta:</label>
            <input type="date" th:field="*{fechaVenta}" required>
        </div>

        <div class="form-group full-width">
            <label>Cliente:</label>
            <select th:field="*{cliente}" required>
                <option value="" disabled selected>Seleccione un cliente...</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.DPICliente}"
                        th:text="${c.nombreCliente + ' (' + c.DPICliente + ')'}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Atendido por (Vendedor):</label>
            <select th:field="*{usuario}" required>
                <option value="" disabled selected>Seleccione usuario...</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.codigoUsuario}"
                        th:text="${u.username}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Monto Total (Q):</label>
            <input type="number" step="0.01" th:field="*{total}" placeholder="0.00" required>
        </div>

        <input type="hidden" th:field="*{estado}" value="1">

        <div class="actions-container full-width">
            <button type="submit" class="btn-main btn-fire">GUARDAR VENTA</button>
            <button type="button" class="btn-main"
                    onclick="if(confirm('¿Deseas cancelar el registro?')) { history.back(); }">
                CANCELAR
            </button>
        </div>
    </form>
</div>

</body>
</html>
